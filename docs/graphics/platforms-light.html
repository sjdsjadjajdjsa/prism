<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Where Prism runs</title>
<style>
* { box-sizing: border-box; margin: 0; }
html { background: transparent; }
body { position: relative; width: 1280px; height: 288px; overflow: hidden; border-radius: 28px; border: 2px solid rgba(29,26,46,.12);
  background: radial-gradient(900px 420px at 50% 0%, #ece6ff, #fbfaff 75%); color: #1d1a2e;
  font: 500 24px/1.2 'JetBrains Mono', 'JetBrainsMono Nerd Font', 'JetBrainsMono NF', ui-monospace, monospace; }
.px { display: grid; gap: 2px; position: absolute; }
.px i { display: block; }
.muted { color: #5d5875; }

body { padding: 44px; }
.tile { border-radius: 20px; border: 2px solid rgba(29,26,46,.12); background: rgba(29,26,46,.04); }
.ico { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.title { font-size: 24px; font-weight: 800; letter-spacing: -.01em; color: #1d1a2e; }
.text { font-size: 18px; line-height: 25px; color: #5d5875; }
.beam { position: absolute; left: 44px; right: 44px; bottom: 0; height: 4px; border-radius: 2px 2px 0 0;
  background: linear-gradient(90deg, #ff5f6d, #ffa25f, #f9e27d, #7ee2a8, #6fd3ff, #8a9bff, #c69bff); opacity: 0.55; }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.p { height: 200px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.status { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 2px solid rgba(29,26,46,.12); background: rgba(29,26,46,.04); }
.status i { width: 10px; height: 10px; border-radius: 5px; }
</style>
<body>
<div class="grid"><div class="tile p"><div class="top"><div class="ico" style="background:rgba(191,76,96,0.16)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#bf4c60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#bf4c60"></i>tested</span></div><div><div class="title">Linux</div><div class="text">Ubuntu, Mint, Debian</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(187,168,107,0.16)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#bba86b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#bba86b"></i>tested</span></div><div><div class="title">Arch Linux</div><div class="text">Arch, CachyOS, Omarchy</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(90,158,198,0.16)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5a9ec6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#5a9ec6"></i>tested</span></div><div><div class="title">Windows 11</div><div class="text">WSL with Docker Desktop</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(151,118,198,0.16)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9776c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#9776c6"></i>tested</span></div><div><div class="title">macOS</div><div class="text">Docker Desktop</div></div></div></div>
<div class="beam"></div>
</body></html>
