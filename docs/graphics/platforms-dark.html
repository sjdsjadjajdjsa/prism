<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Where Prism runs</title>
<style>
* { box-sizing: border-box; margin: 0; }
html { background: transparent; }
body { position: relative; width: 1280px; height: 296px; overflow: hidden; border-radius: 28px; border: 2px solid rgba(236,233,246,.10);
  background: radial-gradient(900px 420px at 50% 0%, #1b1833, #0b0b10 75%); color: #ece9f6;
  font: 500 24px/1.2 'JetBrains Mono', 'JetBrainsMono Nerd Font', 'JetBrainsMono NF', ui-monospace, monospace; }
.px { display: grid; gap: 2px; position: absolute; }
.px i { display: block; }
.muted { color: #b4b0c8; }

body { padding: 44px; }
.tile { border-radius: 20px; border: 2px solid rgba(236,233,246,.10); background: rgba(236,233,246,.05); }
.ico { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.title { font-size: 24px; font-weight: 800; letter-spacing: -.01em; color: #ece9f6; }
.text { font-size: 18px; line-height: 25px; color: #b4b0c8; }
.beam { position: absolute; left: 44px; right: 44px; bottom: 20px; height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, #ff5f6d, #ffa25f, #f9e27d, #7ee2a8, #6fd3ff, #8a9bff, #c69bff); opacity: 0.7; }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.p { height: 208px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.status { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 2px solid rgba(236,233,246,.10); background: rgba(236,233,246,.05); }
.status i { width: 10px; height: 10px; border-radius: 5px; }
</style>
<body>
<div class="grid"><div class="tile p"><div class="top"><div class="ico" style="background:rgba(255,95,109,0.14)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff5f6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#ff5f6d"></i>tested</span></div><div><div class="title">Linux</div><div class="text">Ubuntu, Mint, Debian</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(249,226,125,0.14)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f9e27d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#f9e27d"></i>tested</span></div><div><div class="title">Arch Linux</div><div class="text">Arch, CachyOS, Omarchy</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(111,211,255,0.14)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6fd3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#6fd3ff"></i>tested</span></div><div><div class="title">Windows 11</div><div class="text">WSL with Docker Desktop</div></div></div><div class="tile p"><div class="top"><div class="ico" style="background:rgba(198,155,255,0.14)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c69bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v12H2zM8 20h8M12 16v4"/></svg></div><span class="status"><i style="background:#c69bff"></i>tested</span></div><div><div class="title">macOS</div><div class="text">Docker Desktop</div></div></div></div>
<div class="beam"></div>
</body></html>
