# Optional. Free AI works without any keys.
# Each key you add unlocks smarter models. Run ./free setup instead of editing by hand.

# Fast Nemotron models, GLM-5.3, GLM-5.3 Flash (Ox Alpha): https://build.nvidia.com
NVIDIA_API_KEY=

# GLM-4.7 Flash: https://z.ai/manage-apikey/apikey-list
ZAI_API_KEY=

# Free OpenRouter models: https://openrouter.ai/keys
OPENROUTER_API_KEY=

# Gemini Flash: https://aistudio.google.com/apikey
GEMINI_API_KEY=

# Groq (very fast): https://console.groq.com/keys
GROQ_API_KEY=

# Codestral: https://console.mistral.ai/api-keys
MISTRAL_API_KEY=

# AI on your own computer with Ollama (https://ollama.com), e.g. qwen3-coder
OLLAMA_MODEL=
# Only if Ollama is not on this computer, e.g. http://192.168.1.20:11434/v1
OLLAMA_URL=
