name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - name: Go
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -count=1 ./...
      - name: Web
        run: node --check web/app.js
      - name: Router
        run: |
          node --check router/server.mjs
          node --check router/custom.mjs
          node --check router/check.mjs
          (cd router && node --test)
          node -e "JSON.parse(require('fs').readFileSync('router/providers.json','utf8'))"
      - name: Scripts
        run: |
          bash -n prism install.sh bench/run.sh bench/chat.sh bench/compare.sh bench/harness/run.sh
          python3 -m pip install --quiet pillow
          python3 bench/chart.py
          git diff --exit-code docs/*.svg
      - name: Images
        run: docker build -q router && docker build -q -f agent/Dockerfile .
