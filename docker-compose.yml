name: prism

services:
  router:
    build: ./router
    env_file:
      - path: keys.conf
        required: false
    ports:
      - "127.0.0.1:4848:4848"
    environment:
      HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - router-data:/data
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    profiles: [agent]
    depends_on: [router]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      PRISM_API: http://router:4848/v1
      PRISM_LISTEN: ${PRISM_LISTEN:-0.0.0.0:4849}
      PRISM_WEB_LISTEN: ${PRISM_WEB_LISTEN:-}
      PRISM_PUBLIC_PORT: ${PRISM_PUBLIC_PORT:-}
      PRISM_PROJECT: ${PRISM_PROJECT:-}
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
    volumes:
      - ${PROJECT_DIR:-./workspace}:/workspace
      - prism-config:/home/prism/.config/prism
    stdin_open: true
    tty: true

volumes:
  router-data:
  prism-config:
